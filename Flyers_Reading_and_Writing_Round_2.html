const sections = [{"title": "Part 1 · Definitions", "instruction": "Choose a word from the box and write it next to the correct definition. There are extra words.", "items": [["This person brings food and drinks to people at their tables in a restaurant.", "a waiter"], ["A bird can make this from small sticks and lay its eggs in it.", "a nest"], ["You wear this when you go swimming.", "a swimsuit"], ["You can wrap this around a part of your body that you’ve hurt.", "a bandage"], ["This material comes from sheep. People use it to make warm clothes.", "wool"], ["This is a small area of still water. You might see ducks swimming on it.", "a pond"], ["This is like a very small river. Water moves along it.", "a stream"], ["This is the way into a building or another place.", "an entrance"], ["These are two thin sticks that you can use to pick up food.", "chopsticks"], ["This is a piece of land where farmers can grow things or keep animals.", "a field"]], "passage": "", "bank": "a bandage|a pond|chopsticks|a mechanic|a stream|a nest|a swimsuit|a waiter|a waterfall|wool|a field|an entrance|a cage|a sweater|a spoon", "kind": "text"}, {"title": "Part 2 · Conversation", "instruction": "Choose the best reply for each question. Write its letter.", "items": [["Did you go into town with your cousin yesterday?", "C"], ["Where did you go instead?", "F"], ["Oh, I know that place! Did you have lunch there?", "D"], ["What did you have?", "A"], ["Would you like to go there again next weekend?", "B"]], "passage": "", "bank": "A · A sausage sandwich and some salad.|B · Yes, I’d love to. Shall we take our bikes?|C · No. We wanted to spend the day in the countryside.|D · Yes, we ate at a little café near the bridge.|E · We went last Saturday.|F · To the village where our grandparents live.|G · It was next to the entrance.", "kind": "dialogue"}, {"title": "Part 3 · Story and title", "instruction": "Copy one word from the box into each gap. Then choose the best title.", "items": [["Gap 1", "bridge"], ["Gap 2", "leaf"], ["Gap 3", "worried"], ["Gap 4", "carried"], ["Gap 5", "safe"], ["Choose the best title.", "A little frog needs help", "Leo learns to build a bridge", "A picnic in the wood"]], "passage": "Mia and her grandson Leo went for a walk in a small wood. When they reached a wooden {{1}}, Leo heard a strange noise. He looked down and saw a tiny frog sitting on a large {{2}} in the water.\n\nThe frog was moving quickly towards some rocks. Leo felt {{3}}, but Mia showed him how to help. She picked up a long stick and held it near the leaf. The frog jumped onto it, and Leo carefully {{4}} it to the grass. It was {{5}} at last.", "bank": "bridge|worried|carried|leaf|safe|stream|thirsty|shiny", "kind": "inline-text"}, {"title": "Part 4 · Factual text", "instruction": "Choose the correct word for each gap.", "items": [["Gap 1", "than", "then", "that"], ["Gap 2", "where", "which", "when"], ["Gap 3", "in", "from", "above"], ["Gap 4", "because", "but", "or"], ["Gap 5", "if", "so", "until"]], "passage": "Life around a pond\n\nA pond is usually smaller {{1}} a lake. It can be a good place {{2}} animals find food and water. Some frogs lay their eggs {{3}} the water. Birds sometimes build nests near a pond {{4}} there are plenty of insects to eat. If you visit a pond, try to walk quietly. You might see more animals {{5}} you stop and wait.", "bank": "", "kind": "inline-choice"}, {"title": "Part 5 · Story comprehension", "instruction": "Read the story. Complete each sentence with one to four words.", "items": [["Emma and Max went to the hill by ___.", "bike", "bicycle"], ["At the top, they could see the ___ from the bench.", "fields"], ["Max was opening his ___ when the cap blew away.", "lunch box"], ["Emma slipped on some ___.", "wet leaves"], ["Max found the cap beside a ___.", "small stream", "stream"], ["They went to the ___ to buy something for Emma’s knee.", "chemist’s"], ["Emma left her cap ___ so it could dry.", "by the window"]], "passage": "The missing baseball cap\n\nOn Sunday, Emma and her cousin Max rode their bikes from their village to a hill. At the top there was a wooden bench with a view of the fields. They parked their bikes beside it and sat down to eat their lunch.\n\nWhile Max was opening his lunch box, the wind blew Emma’s baseball cap off her head. The cap went down the hill and disappeared. Emma ran after it, but she slipped on some wet leaves and hurt her knee.\n\nMax asked Emma to stay on the path while he looked for the cap. He found it on the ground beside a small stream. It was wet, but it hadn’t fallen into the water.\n\nWhen they got back to the village, Emma’s grandparent took them to the chemist’s. They bought a bandage for Emma’s knee. At home, Emma put her cap by the window to dry.", "bank": "", "kind": "text"}, {"title": "Part 6 · Open gaps", "instruction": "Read the email. Write one word in each gap.", "items": [["Gap 1", "been"], ["Gap 2", "that", "which"], ["Gap 3", "than"], ["Gap 4", "of"], ["Gap 5", "with"]], "passage": "Hi Lucy,\n\nHave you ever {{1}} to the park near my village? There’s a big pond there, and there’s a path {{2}} goes all the way around it.\n\nI went there with my cousin yesterday. His bag was heavier {{3}} mine because he had packed our lunch and two bottles {{4}} water. We sat on the grass to eat. Would you like to come {{5}} us next time?\n\nSee you soon,\nAlex", "bank": "", "kind": "inline-text"}, {"title": "Part 7 · Picture story", "instruction": "Look at the three pictures. Write a story. Write 20 or more words.", "items": [], "passage": "", "bank": "", "kind": "story", "image": "data:image/webp;base64,UklGRp5dBQBXRUJQVlA4IJJdBQCwigudASrWBkcCPj0WiUMiISEYavdUIAPEtDcoat2NFO++5nOezpKo1/3a5tM++M9myugWWQm2Q2d+9aS89tIafN5jPsFSvy3+T0b8e+o/3P+N/zn/L/x/7k/KLxr1cenfuH+U/3X+D//P/E+5397/4/9R+YffT8B/vP/f/r/zS98f1v+N/7P+W/1P/s/1P/////3G/1//t/0n+3+En9G/xX/i/zH+n//P/B+wb+cf2H/kf4H/P//P/X////7/hn/n/uR/wviD/ef+d+3n+////yL/p3+c/+v+x/2///+Y//mf/P/ef8X///Lb/A/8H/5/7r/i///6Bv6l/lf }
function make(tag,text) {
  const item = document.createElement(tag);
  if (text !== undefined) item.textContent = text;
  return item;
}
function control(section,index) {
  const [question,...keys] = section.items[index];
  const choice = usesChoices(section,index);
  const field = make(choice ? "select" : "input");
  if (choice) {
    const options = section.kind === "choice" && keys.length === 1 ? section.bank.split("|") : keys;
    const offset = (index + current + 1) % options.length;
    field.append(new Option("Choose…",""));
    for (const value of [...options.slice(offset), ...options.slice(0,offset)]) field.append(new Option(value,value));
  } else {
    field.type = "text";
    field.maxLength = 120;
    field.autocomplete = "off";
    field.spellcheck = false;
  }
  field.value = answers[current][index];
  field.disabled = submitted || pending;
  field.setAttribute("aria-label", (index+1) + ". " + question);
  const group = current;
  field.addEventListener("input",() => {
    answers[group][index] = field.value;
    progress();
  });
  return field;
}
function render(focus = false) {
  const section = sections[current];
  get("activity").hidden = false;
  get("results").hidden = true;
  get("heading").textContent = section.title;
  get("instruction").textContent = section.instruction;
  const content = get("content");
  content.replaceChildren();
  if (section.bank) {
    const bank = make("div");
    bank.className = section.kind === "dialogue" ? "bank replies" : "bank";
    for (const word of section.bank.split("|")) bank.append(make("span",word));
    content.append(bank);
  }
  if (section.image) {
    const image = make("img");
    image.src = section.image;
    image.alt = section.kind === "story" ? "Three pictures for the story-writing task" : "Numbered body and face pictures";
    content.append(image);
  }
  if (section.kind === "story") {
    const story = make("textarea");
    story.setAttribute("aria-label","Your story");
    story.maxLength = 5000;
    story.value = answers[current][0];
    story.disabled = submitted || pending;
    const words = make("p",countWords(story.value)+" words");
    const group = current;
    story.oninput = () => {
      answers[group][0] = story.value;
      words.textContent = countWords(story.value)+" words";
      progress();
    };
    content.append(story,words);
  }
  const inline = section.kind.startsWith("inline");
  let embedded = 0;
  if (section.passage) {
    const passage = make("div");
    passage.className = "passage";
    for (const [index,fragment] of section.passage.split(/\{\{(\d+)\}\}/).entries()) {
      if (inline && index % 2) {
        const field = control(section,Number(fragment)-1);
        field.className = "inline";
        passage.append("("+fragment+") ",field);
        embedded++;
      } else passage.append(fragment);
    }
    content.append(passage);
  }
  section.items.slice(embedded).forEach(([question],localIndex) => {
    const index = localIndex + embedded;
    const label = make("label");
    const line = make("div");
    line.className = "item";
    label.append((index+1)+". "+(section.kind === "dialogue" ? "Ella: " : "")+question);
    if (section.kind === "dialogue") label.append("  Tom: ");
    label.append(control(section,index));
    line.append(label);
    content.append(line);
  });
  get("nav").replaceChildren(...sections.map((entry,index) => {
    const button = make("button",entry.title);
    if (index === current) button.setAttribute("aria-current","true");
    button.disabled = pending;
    button.onclick = () => move(index);
    return button;
  }));
  get("next").disabled = current === sections.length-1 || pending;
  get("previous").disabled = !current || pending;
  get("student").disabled = submitted || pending;
  get("submit").disabled = pending;
  get("submit").textContent = submitted ? "Back to results" : "Submit my answer";
  progress();
  if (focus) get("heading").focus();
}
function move(index) {
  if (pending) return;
  current = index;
  get("status").textContent = "";
  render(true);
}
function showResults() {
  const breakdown = get("breakdown");
  breakdown.replaceChildren();
  let score = 0;
  sections.forEach(section => {
    if (section.kind === "story") return;
    const points = section.items.filter((_,index) => isCorrect(section,index)).length;
    score += points;
    breakdown.append(make("p",section.title+" · "+points+"/"+section.items.length));
  });
  get("resultTitle").textContent = score+" / "+total+" correct";
  get("summary").textContent = "Your submission request was sent." + (tasks>total ? " Part 7 is for your teacher to mark." : "");
  get("activity").hidden = true;
  get("results").hidden = false;
  get("resultTitle").focus();
}
function requestSubmission() {
  if (pending) return;
  if (submitted) return showResults();
  if (!get("student").value.trim()) {
    get("status").textContent = "Enter your name or initials before submitting.";
    return get("student").focus();
  }
  const blank = answers.flat().filter(value => !value.trim()).length;
  if (blank) {
    get("confirmText").textContent = blank === 1 ? "You have 1 unanswered question." : "You have "+blank+" unanswered questions.";
    get("confirm").showModal();
  } else submit();
}
async function submit() {
  if (pending || submitted) return;
  const name = get("student").value.trim();
  const lines = [];
  const missed = [];
  let score = 0;
  sections.forEach((section,group) => {
    if (section.kind === "story") {
      lines.push(section.title+" ("+countWords(answers[group][0])+" words):\n"+(answers[group][0].trim() ? answers[group][0] : "[unanswered]"));
      return;
    }
    section.items.forEach(([question],index) => {
      const value = answers[group][index].trim();
      const label = section.title+" #"+(index+1)+": "+question;
      const correct = isCorrect(section,index);
      if (correct) score++;
      else missed.push(label+" → "+(value || "[unanswered]")+" · Correct: "+accepted(section,index).join(" / "));
      lines.push(label+" → "+(value || "[unanswered]")+" ("+(correct ? "Correct" : value ? "Incorrect" : "Blank")+")");
    });
  });
  const payload = {studentName:/^[=+@-]/.test(name) ? "'"+name : name,activity:title,score,total,answers:lines.join("\n"),incorrect:missed.join("\n") || "None"};
  pending = true;
  render();
  get("status").textContent = "Sending your answers…";
  try {
    await fetch(endpoint,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(payload)});
    submitted = true;
  } catch {
    get("status").textContent = "Couldn’t send your answers. Please try submitting again.";
  } finally {
    pending = false;
    render();
  }
  if (submitted) showResults();
}
get("previous").onclick = () => move(current-1);
get("next").onclick = () => move(current+1);
get("submit").onclick = requestSubmission;
get("keep").onclick = () => get("confirm").close();
get("anyway").onclick = () => {
  get("confirm").close();
  return submit();
};
get("review").onclick = () => move(0);
render();
</script>
</html>
